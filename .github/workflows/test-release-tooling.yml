name: test release tooling

permissions:
  contents: read

on:
  pull_request:
    branches:
      - simbox/ci
  push:
    branches:
      - simbox/ci

jobs:
  test:
    name: Test publication contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check release scripts
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done
      - name: Check npm registry version query
        env:
          # The registry the family publishes to since it left GitHub Packages;
          # each release line declares its own in .release/line.json.
          REGISTRY: https://registry.npmjs.org
          # The probe makes the same live query a release run makes, so it names
          # the identity this repository owns and publishes rather than a scope
          # written down here.
          PUBLISHED_PACKAGE: "@${{ github.repository_owner }}/pglite"
          # A 404 is judged only against a declared expectation. The family is
          # published under this owner, so a 404 now means the record is gone,
          # and the probe fails on it.
          PUBLISHED_STATE: present
        run: |
          # Positive control, so that a 404 below is an answer about the package
          # rather than about the connection: this fails loudly on the wrong
          # registry host or an unreachable one, which the package query itself
          # cannot distinguish from an absent record. It runs as its own command
          # rather than inside a substitution, which would swallow its exit
          # status and defeat the whole check.
          npm ping --registry="$REGISTRY"

          set +e
          output="$(npm view "$PUBLISHED_PACKAGE@>=0.0.0" version --json \
            --registry="$REGISTRY" 2> "$RUNNER_TEMP/npm-view.err")"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if [ "$PUBLISHED_STATE" = "absent" ] && grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              echo "$PUBLISHED_PACKAGE is absent, as declared"
              exit 0
            fi
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi

          if [ "$PUBLISHED_STATE" = "absent" ]; then
            echo "$PUBLISHED_PACKAGE is declared absent, but the registry returned a record" >&2
            echo "$output" >&2
            exit 1
          fi

          node --input-type=module --eval '
            import { parsePublishedVersions } from "./.github/scripts/classify-packages.mjs"
            parsePublishedVersions(process.argv[1], process.argv[2])
          ' "$output" "$PUBLISHED_PACKAGE"
      - name: Test release scripts
        run: node --test .github/scripts/release-tools.test.mjs
