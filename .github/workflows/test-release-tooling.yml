name: test release tooling

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      - simbox/ci
  push:
    branches:
      - simbox/ci

jobs:
  test:
    name: Test publication contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"
      - name: Check release scripts
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done
      - name: Check GitHub Packages version query
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The probe makes the same live query a release run makes, so it names
          # the identity this repository owns and publishes rather than a scope
          # written down here. On GitHub Packages the scope is the owner, and the
          # run token can only read what its own owner holds.
          PUBLISHED_PACKAGE: "@${{ github.repository_owner }}/pglite"
          # GitHub Packages answers an absent record and an unreadable one with the
          # same 404, in the same words — it says so itself: "could not be found or
          # you do not have permission to access it". A 404 therefore carries no
          # meaning on its own, and is only judged here against a declared
          # expectation. The family is published under this owner, so a 404 now
          # means the record is gone or unreadable, and the probe fails on it.
          PUBLISHED_STATE: present
        run: |
          # Positive control, so that a 404 below is an answer about the package
          # rather than about the connection: this fails loudly on a missing token,
          # a rejected one, or the wrong registry host, none of which the package
          # query itself can distinguish from an absent record. It runs as its own
          # command rather than inside a substitution, which would swallow its
          # exit status and defeat the whole check.
          echo "registry identity:"
          npm whoami --registry=https://npm.pkg.github.com

          set +e
          output="$(npm view "$PUBLISHED_PACKAGE@>=0.0.0" version --json \
            --registry=https://npm.pkg.github.com 2> "$RUNNER_TEMP/npm-view.err")"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if [ "$PUBLISHED_STATE" = "absent" ] && grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              echo "$PUBLISHED_PACKAGE is absent, as declared"
              exit 0
            fi
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi

          if [ "$PUBLISHED_STATE" = "absent" ]; then
            echo "$PUBLISHED_PACKAGE is declared absent, but the registry returned a record" >&2
            echo "$output" >&2
            exit 1
          fi

          node --input-type=module --eval '
            import { parsePublishedVersions } from "./.github/scripts/classify-packages.mjs"
            parsePublishedVersions(process.argv[1], process.argv[2])
          ' "$output" "$PUBLISHED_PACKAGE"
      - name: Test release scripts
        run: node --test .github/scripts/release-tools.test.mjs
